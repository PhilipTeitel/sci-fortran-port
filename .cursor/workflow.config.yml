modernization:
  legacyRepoPath: /Users/philipteitel/code/ADD-migrations/sci-fortran-legacy
  sourceStack:
    family: fortran
    language: fortran
    dialect: TBD
    version: TBD
    compiler:
      name: gfortran
      version: "16.1.0"
    build:
      system: TBD
      version: TBD
    numeric:
      libraries: []
      precision: real(8)
    knownHazards:
      - COMMON
      - EQUIVALENCE
      - implicit typing
      - column-major arrays
      - fixed-form IO
      - GOTO
      - numeric precision drift

  targetStack:
    language: C#
    version: .NET 8
    framework: ASP.NET Core

  # Global default remains conservative. BEH-001/FIX-001 is scoped T1 at probe
  # revision e586903 (ADR-001). BEH-002–BEH-004 are T1 hash-only. Other retained
  # surfaces remain T3 until sliced. Product scope is the whole library (ADR-004).
  oracleTier: T3 documented-only

  firstSlice:
    behavior: BEH-001
    surface: library-linspace
    drivingAdapter: managed-api
    architecture: hexagonal
    baselineRevision: e586903a26cc50ca8942f20ca3bccbd8814e6252

  retainedScope:
    product: whole-library-csharp-poc
    catalog: docs/modernization/behavior-catalog.md
    nextCommand: design-application
    plan: docs/modernization/migration-plan.md

  evidenceGrades:
    E1: verified
    E2: documented
    E3: code-derived
    E4: inferred
    E5: unknown

  stagingStrategies: [strangler, phased-rewrite, big-bang-parallel-run]
  structureFidelity: [preserve-then-refactor, refactor-now]
  defectPolicy: reproduce-then-refactor

  parity:
    numericTolerance:
      relative: 1e-6
      absolute: 1e-6
    textNormalization:
      whitespace:
        trimWhitespace: true
        normalizeLineEndings: true
        caseSensitivity: true
